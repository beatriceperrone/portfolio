<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Inter", -apple-system, sans-serif;
    width: 1200px; height: 630px;
    background: #fbf6ef;
    color: #1b1721;
    position: relative;
    overflow: hidden;
  }
  /* decorazione radiale come la hero */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 55% at 20% -10%, rgba(36,88,212,0.12), transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 110%, rgba(255,110,82,0.12), transparent 60%);
  }
  .content {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 0 110px;
  }
  .eyebrow {
    font-size: 26px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: #6f6875; display:flex; align-items:center; gap:20px;
  }
  .eyebrow::before { content:""; width:56px; height:4px; background:#2458D4; opacity:.6; }
  .name {
    margin-top: 34px;
    font-size: 148px; font-weight: 850; letter-spacing:-0.05em; line-height:0.98;
  }
  .name .blue { color:#2458D4; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <div class="eyebrow">Portfolio</div>
    <div class="name"><span class="blue">Beatrice</span> Perrone</div>
  </div>
</body>
</html>
